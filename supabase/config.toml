# ============================================================
# Restaurante Pro — Configuración del Supabase CLI
# ============================================================
# Permite usar: supabase db push, supabase db reset, supabase start (local)
# Docs: https://supabase.com/docs/guides/local-development
# ============================================================

project_id = "restaurante-pro"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = true
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true
port = 54324

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54325

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
port = 54326
site_url = "http://localhost:8081"
additional_redirect_urls = ["restaurante-pro://", "exp://localhost:8081"]

[auth.email]
enable_signup = true
enable_confirmations = false
double_confirm_changes = false

[auth.external.github]
enabled = false

[auth.external.google]
enabled = false

[analytics]
enabled = false
